<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor de Video</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    .player-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16/9;
      background-color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .play-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      transition: background 0.3s;
    }
    .play-overlay:hover {
      background: rgba(0, 0, 0, 0.2);
    }
    .play-btn {
      width: 80px;
      height: 80px;
      background-color: rgba(255, 0, 0, 0.9);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      transition: transform 0.2s;
    }
    .play-btn:hover {
      transform: scale(1.1);
    }
    .play-btn::after {
      content: "";
      display: block;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 18px 0 18px 30px;
      border-color: transparent transparent transparent #ffffff;
      margin-left: 5px;
    }
    .error-msg {
      color: #fff;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="player-container" id="playerContainer" onclick="manejarClic()">
    <video id="videoPlayer" controls style="display: none;"></video>
    
    <div class="play-overlay" id="playOverlay">
      <div class="play-btn"></div>
    </div>
  </div>

  <script>
    // Leer los parámetros de la URL de forma segura
    const params = new URLSearchParams(window.location.search);
    const vParam = params.get('v');
    const aParam = params.get('a');
    const dParam = params.get('d'); // Respaldo formato antiguo

    let videoUrl = "";
    let adUrl = "";

    try {
      if (vParam && aParam) {
        videoUrl = atob(vParam);
        adUrl = atob(aParam);
      } else if (dParam) {
        const data = JSON.parse(decodeURIComponent(escape(atob(dParam))));
        videoUrl = data.vid;
        adUrl = data.ad;
      }
    } catch (e) {
      console.error("Error al decodificar los enlaces", e);
    }

    const container = document.getElementById('playerContainer');
    const video = document.getElementById('videoPlayer');
    const overlay = document.getElementById('playOverlay');

    let clicks = 0;

    if (!videoUrl || !adUrl) {
      container.innerHTML = '<div class="error-msg"><h2>Enlace inválido o incompleto.</h2><p>Verifica el enlace generado.</p></div>';
    } else {
      // Configuramos el video oculto de fondo
      video.src = videoUrl;
    }

    function manejarClic() {
      if (!videoUrl || !adUrl) return;

      clicks++;

      if (clicks === 1) {
        // Primer clic: Abre el anuncio en una pestaña nueva y prepara el video
        window.open(adUrl, '_blank');
        
        // Ocultamos la capa de reproducción falsa y mostramos el reproductor real
        overlay.style.display = 'none';
        video.style.display = 'block';
        video.play();
      } else {
        // Segundo clic en adelante: Redirige directamente al link del video original
        window.location.href = videoUrl;
      }
    }
  </script>

</body>
</html>
