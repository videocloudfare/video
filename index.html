<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Video + Ad</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }
    .card {
      background-color: #1e1e1e;
      padding: 25px;
      border-radius: 12px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }
    h2 {
      margin-top: 0;
      text-align: center;
      color: #ff3b3b;
    }
    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-size: 14px;
      color: #cccccc;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background-color: #2a2a2a;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #ff3b3b;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background-color: #ff3b3b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #e02e2e;
    }
    .resultado-box {
      display: none;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #333;
    }
    .btn-copiar {
      background-color: #0088cc;
      margin-top: 10px;
    }
    .btn-copiar:hover {
      background-color: #006699;
    }
    .aviso {
      font-size: 12px;
      color: #888;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Generador de Video + Ad</h2>

    <label for="vidUrl">Link del Video (ej. videy / ou.gy):</label>
    <input type="url" id="vidUrl" placeholder="https://videy.cc/v/..." required>

    <label for="adUrl">Link del Anuncio (ej. salien.com):</label>
    <input type="url" id="adUrl" placeholder="https://salien.com/..." required>

    <label for="imgUrl">Link de Miniatura / Portada (Opcional):</label>
    <input type="url" id="imgUrl" placeholder="Dejar vacío para fondo negro por defecto">

    <button onclick="generarEnlace()">Generar Enlace Corto</button>

    <div class="resultado-box" id="resultadoBox">
      <label>Tu enlace listo para copiar:</label>
      <input type="text" id="linkFinal" readonly>
      <button class="btn-copiar" onclick="copiarEnlace()" id="btnCopiar">Copiar Enlace</button>
      <div class="aviso" id="avisoEstado"></div>
    </div>
  </div>

  <script>
    async function generarEnlace() {
      const vid = document.getElementById('vidUrl').value.trim();
      const ad = document.getElementById('adUrl').value.trim();
      const img = document.getElementById('imgUrl').value.trim();

      if (!vid || !ad) {
        alert("Mano, mete al menos el link del video y el del anuncio.");
        return;
      }

      // Empaquetar y cifrar en Base64
      const payload = { vid: vid, ad: ad };
      if (img) payload.img = img;
      const codigo = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));

      const urlBase = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
      const urlLarga = `${urlBase}ver.html?d=${codigo}`;

      document.getElementById('linkFinal').value = "Generando link corto...";
      document.getElementById('resultadoBox').style.display = 'block';
      document.getElementById('avisoEstado').innerText = "";

      try {
        // Usando un endpoint seguro de TinyURL con formato texto plano
        const respuesta = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(urlLarga)}`);
        
        if (respuesta.ok) {
          const urlCorta = await respuesta.text();
          if (urlCorta && urlCorta.startsWith('http')) {
            document.getElementById('linkFinal').value = urlCorta;
            document.getElementById('avisoEstado').innerText = "¡Enlace acortado con éxito!";
          } else {
            throw new Error("Respuesta inválida");
          }
        } else {
          throw new Error("Error en servidor");
        }
      } catch (error) {
        // Si el navegador bloquea la petición externa, usamos un acortador alternativo ultra rápido (is.gd)
        try {
          const respAlt = await fetch(`https://is.gd/create.php?format=simple&url=${encodeURIComponent(urlLarga)}`);
          if (respAlt.ok) {
            const urlAlt = await respAlt.text();
            if (urlAlt && urlAlt.startsWith('http')) {
              document.getElementById('linkFinal').value = urlAlt;
              document.getElementById('avisoEstado').innerText = "¡Enlace acortado con éxito (Alternativa 2)!";
              return;
            }
          }
        } catch (e) {}

        // Si de plano los bloquea todos por seguridad local, te deja el link funcional
        document.getElementById('linkFinal').value = urlLarga;
        document.getElementById('avisoEstado').innerText = "Nota: Usando enlace directo (copia y usa un acortador manual si lo prefieres).";
      }

      document.getElementById('btnCopiar').innerText = 'Copiar Enlace';
    }

    function copiarEnlace() {
      const inputLink = document.getElementById('linkFinal');
      inputLink.select();
      inputLink.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(inputLink.value);
      
      document.getElementById('btnCopiar').innerText = '¡Copiado al portapapeles!';
    }
  </script>

</body>
</html>
