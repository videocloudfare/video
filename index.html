<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Video + Ad</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }
    .card {
      background-color: #1e1e1e;
      padding: 25px;
      border-radius: 12px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }
    h2 {
      margin-top: 0;
      text-align: center;
      color: #ff3b3b;
    }
    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-size: 14px;
      color: #cccccc;
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background-color: #2a2a2a;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #ff3b3b;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background-color: #ff3b3b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #e02e2e;
    }
    .resultado-box {
      display: none;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #333;
    }
    .btn-copiar {
      background-color: #0088cc;
      margin-top: 10px;
    }
    .btn-copiar:hover {
      background-color: #006699;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Generador de Video + Ad</h2>

    <label for="vidUrl">Link del Video:</label>
    <input type="url" id="vidUrl" placeholder="https://..." required>

    <label for="adUrl">Link del Anuncio:</label>
    <input type="url" id="adUrl" placeholder="https://..." required>

    <button onclick="generarEnlace()">Generar Enlace Compacto</button>

    <div class="resultado-box" id="resultadoBox">
      <label>Tu enlace listo:</label>
      <input type="text" id="linkFinal" readonly>
      <button class="btn-copiar" onclick="copiarEnlace()" id="btnCopiar">Copiar Enlace</button>
    </div>
  </div>

  <script>
    function generarEnlace() {
      const vid = document.getElementById('vidUrl').value.trim();
      const ad = document.getElementById('adUrl').value.trim();

      if (!vid || !ad) {
        alert("Mano, rellena ambos campos.");
        return;
      }

      // Codificar en Base64 de forma ultra compacta
      const vB64 = btoa(vid);
      const aB64 = btoa(ad);

      const urlBase = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
      const urlFinal = `${urlBase}ver.html?v=${vB64}&a=${aB64}`;

      document.getElementById('linkFinal').value = urlFinal;
      document.getElementById('resultadoBox').style.display = 'block';
      document.getElementById('btnCopiar').innerText = 'Copiar Enlace';
    }

    function copiarEnlace() {
      const inputLink = document.getElementById('linkFinal');
      inputLink.select();
      inputLink.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(inputLink.value);
      
      document.getElementById('btnCopiar').innerText = '¡Copiado al portapapeles!';
    }
  </script>

</body>
</html>
